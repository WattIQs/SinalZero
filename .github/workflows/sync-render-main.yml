name: Sync Render branch to Vercel

on:
  push:
    branches: [vercel]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'sync: copy star-filter-fix render to vercel'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SinalZero
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace branch with Render source
        shell: bash
        run: |
          set -euo pipefail
          git remote add render https://github.com/WattIQs/star-filter-fix.git
          git fetch --depth=1 render render
          git rm -r --ignore-unmatch .
          git checkout FETCH_HEAD -- .
          rm -f .github/workflows/sync-render-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already synchronized."
            exit 0
          fi
          git commit -m "sync: copy star-filter-fix render to vercel"
          git push origin HEAD:vercel
